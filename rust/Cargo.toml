[workspace]
resolver = "2"
members = [
    "crates/csv_reader",
    "crates/db",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = []
license = "MIT"

[workspace.dependencies]
rusqlite = { version = "0.33.0", features = ["bundled"] }
csv = "1.3.1"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4.39", default-features = false, features = ["std", "clock"] }
clap = { version = "4.5.23", features = ["derive"] }
thiserror = "2.0.11"
anyhow = "1.0.95"
walkdir = "2.5.0"
tempfile = "3.15.0"
